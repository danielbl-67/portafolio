<section class="info-card-projects">
  <h2>🎯 Proyectos destacados</h2>
  
  <div class="projects-list">
    @for (project of projectsList; track project.title) {
      <article class="featured-project-box">
        <h3>🏋️ {{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <div class="tech-tags">
          @for (tech of project.technologies; track tech) {
            <span class="tag">{{ tech }}</span>
          }
        </div>
        <a [href]="project.link" target="_blank" class="repo-btn">
          🔗 VER REPOSITORIO
        </a>
      </article>
    }
  </div>
</section>
