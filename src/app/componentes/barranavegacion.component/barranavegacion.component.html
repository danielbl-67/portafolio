<header class="fixed top-0 left-0 w-full bg-[#0b0f19]/90 backdrop-blur-md z-40 border-b border-slate-800">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <!-- Logotipo -->
    <a href="#inicio" class="text-xl font-bold tracking-tight text-white flex items-center gap-1">
      <span class="text-blue-500 font-mono">&lt;</span>burdallo<span class="text-blue-500 font-mono">.dev/&gt;</span>
    </a>

    <!-- Navegación Escritorio -->
    <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-slate-300">
      <a href="#inicio" class="hover:text-blue-400 transition-colors">Inicio</a>
      <a href="#sobremi" class="hover:text-blue-400 transition-colors">Sobre Mí</a>
      <a href="#tecnologias" class="hover:text-blue-400 transition-colors">Tecnologías y Servicios</a>
      <a href="#contacto" class="hover:text-blue-400 transition-colors">Contacto</a>
      <a href="#contacto" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold uppercase tracking-wider transition-all shadow-lg shadow-blue-500/20">
        Ver Portafolio
      </a>
    </nav>

    <!-- Botón Menú Móvil -->
    <button 
      (click)="toggleMenu()"
      class="md:hidden text-slate-300 hover:text-white focus:outline-none p-2"
      aria-label="Abrir Menú">
      <svg *ngIf="!isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg *ngIf="isMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Desplegable Móvil -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-[#0e1626] border-b border-slate-800 px-6 py-6 space-y-4">
    <a (click)="closeMenu()" href="#inicio" class="block text-slate-300 hover:text-blue-400 font-medium">Inicio</a>
    <a (click)="closeMenu()" href="#sobremi" class="block text-slate-300 hover:text-blue-400 font-medium">Sobre Mí</a>
    <a (click)="closeMenu()" href="#tecnologias" class="block text-slate-300 hover:text-blue-400 font-medium">Tecnologías y Servicios</a>
    <a (click)="closeMenu()" href="#contacto" class="block text-slate-300 hover:text-blue-400 font-medium">Contacto</a>
    <a (click)="closeMenu()" href="#contacto" class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg text-sm font-semibold shadow-md shadow-blue-600/30">
      Ver Portafolio
    </a>
  </div>
</header>
